name: ドキュメント修正
description: ドキュメントの改善や追加
title: "[DOCS] "
labels: ["documentation"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 修正の概要
      description: どのドキュメントをどのように修正しますか？
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 修正の理由
      description: なぜこの修正が必要ですか？
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 修正内容の詳細
      description: 具体的な修正案があれば記入してください。
